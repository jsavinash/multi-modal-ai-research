# Phase 8a - SMOKE RUN. Do this before train_micro. Same code path, 1/5.5 the tokens.
#   ~40M tokens / 16,384 tokens-per-step = 2442 steps. ~1-1.5 h at 8-20k tok/s.
# Purpose is NOT quality. Purpose is to prove that:
#   - the tokenizer round-trips,  - the LR schedule does not diverge,
#   - checkpoints resume correctly,  - peak RSS stays under the MemoryGuard budget,
#   - sample.py produces *some* English rather than pure noise (ppl 15-25).
# If train_smoke cannot reach val ppl < 25, do not start the full run - fix the data path.
extends: default.yaml

llm:
  active: micro

data:
  dataset: tinystories
  train_tokens: 40_000_000
  val_tokens: 1_000_000
  shard_dir: data/tinystories
  val_fraction: 0.005

training:
  dtype: bfloat16
  seq_len: 512
  micro_batch_size: 8
  grad_accum_steps: 4
  tokens_per_step: 16384
  max_steps: 2442
  warmup_steps: 100
  lr: 6.0e-4
  min_lr: 6.0e-5
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 10
  checkpoint_interval: 250
  keep_last_checkpoints: 2
  log_interval: 10
  compile: true

run:
  name: micro-smoke-40m
  target_val_loss: 3.20
  target_val_ppl: 25.0
  stop_early_on_divergence: true
  wall_clock_budget_h: 2.5
